; PlatformIO 工程配置 —— M5Stack StickS3 (SKU K150)
; 源码唯一入口: StickS3_RecipCounter.ino (与 Arduino IDE 共用同一份)
; 烧录: pio run -t upload        串口监视: pio device monitor
[platformio]
src_dir = .

[env:sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<*.ino> +<*.ino.cpp> -<.pio/> -<.vscode/>

board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    https://github.com/m5stack/M5Unified.git

upload_protocol = esptool
upload_speed = 921600
upload_port = COM9
; StickS3 走原生 USB-Serial/JTAG，RTS 硬复位无效，烧完会卡在下载模式。
; 用上传后钩子强制看门狗复位，烧完自动启动应用。
extra_scripts = tools/post_upload_reset.py
monitor_speed = 115200
monitor_port = COM9
monitor_filters = esp32_exception_decoder
